name: Auto-merge on approval

# Turns the owner's review into the single merge gate. Branch protection on
# develop/main already requires 1 approving review + the CI `test` check; this
# workflow enables GitHub's native auto-merge (squash) the moment a PR opens,
# so once the owner approves and checks are green the PR merges itself — no
# manual "Merge" click. Drafts are skipped until marked ready for review.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
