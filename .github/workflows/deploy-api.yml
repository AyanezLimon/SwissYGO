name: Deploy API (dev)

# Connected mode is live, so this deploys automatically on backend changes (push
# to develop touching app/server/**, the Dockerfile or compose). It also stays
# available via workflow_dispatch. Requires the JWT_SECRET / ADMIN_PASSWORD repo
# secrets (already configured); the step fails fast if JWT_SECRET is missing. The
# image is API-only (no SPA build), so it's small and rarely rebuilt.
on:
  push:
    branches: [develop]
    paths:
      - 'app/server/**'
      - 'app/Dockerfile'
      - 'app/docker-compose.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, swissygo-pi]
    steps:
      - uses: actions/checkout@v5
      - name: Build & (re)start API container
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          [ -n "$JWT_SECRET" ] || { echo "::error::Missing repo secret JWT_SECRET."; exit 1; }
          docker compose -f app/docker-compose.yml up -d --build
      - name: Smoke test
        run: |
          ok=
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for API... ($i)"; sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::API did not become healthy. Logs:"; docker compose -f app/docker-compose.yml logs --tail=80 || true; exit 1
          fi
          echo "  ✓ API healthy (container)"
      - name: Verify public endpoint (through Caddy/tunnel)
        run: |
          ok=
          for i in $(seq 1 10); do
            if curl -fsS "https://torneodev.elbunkers.com/api/health?cb=$RANDOM" >/dev/null 2>&1; then ok=1; break; fi
            echo "waiting for public /api/health... ($i)"; sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::Public https://torneodev.elbunkers.com/api/health not reachable (Caddy/tunnel?)."; exit 1; fi
          echo "  ✓ API healthy (public end-to-end)"
