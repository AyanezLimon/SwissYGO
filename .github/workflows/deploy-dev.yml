name: Deploy Dev (overhaul)

# Deploys the overhauled app to the Pi's DEV environment as a single Docker
# container (Fastify serves the SPA + API). The Cloudflare tunnel routes
# torneodev.elbunkers.com → host :8787. Independent of production: the prod
# workflow (release-and-deploy.yml) is path-filtered to SwissYGO.html and the
# prod Caddy container is untouched.
on:
  push:
    branches: [develop]
    paths: ['app/**', '.github/workflows/deploy-dev.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: [self-hosted, swissygo-pi]
    steps:
      - uses: actions/checkout@v4

      # The runner builds nothing locally — the image build (SPA + native deps)
      # happens inside Docker. The 'aries' runner user is in the docker group.
      - name: Build & (re)start container
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Missing repo secret JWT_SECRET (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi
          docker compose -f app/docker-compose.yml up -d --build

      - name: Smoke test
        run: |
          sleep 3
          curl -fsS http://127.0.0.1:8787/api/health && echo "  ✓ backend healthy"
          curl -fsS -o /dev/null http://127.0.0.1:8787/ && echo "  ✓ SPA served"
