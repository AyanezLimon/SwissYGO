name: Deploy Web (dev)

# Frontend is plain static files — NO build. Deploy = copy them into the dir the
# existing Caddy serves for torneodev.elbunkers.com. Fast, no Docker, no Node.
# (Mirrors how prod copies SwissYGO.html.) Runs on the self-hosted Pi runner.
on:
  push:
    branches: [develop]
    paths: ['app/web/index.html', 'app/web/css/**', 'app/web/js/**', 'app/web/u/**']
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, swissygo-pi]
    env:
      DEST: ${{ vars.DEV_WEB_PATH || '/DATA/AppData/swissygo-dev' }}
    steps:
      - uses: actions/checkout@v5
      - name: Publish static SPA
        run: |
          mkdir -p "$DEST"
          rsync -a --delete \
            --exclude 'node_modules' --exclude 'package*.json' --exclude '*.test.js' \
            app/web/index.html app/web/css app/web/js app/web/u "$DEST/"
          echo "Static SPA → $DEST"

      # Confirm the LIVE site actually serves what we just published: the served
      # index.html must reference the same cache-busted asset versions as the repo
      # (a stale deploy would still show old ?v=N). Fails the run otherwise.
      - name: Verify deploy is live
        run: |
          BASE="https://torneodev.elbunkers.com"
          want=$(grep -oE '(js|css)/[A-Za-z0-9._-]+\?v=[0-9]+' app/web/index.html | sort -u)
          ok=
          for i in $(seq 1 10); do
            curl -fsS "$BASE/?cb=$RANDOM" -o /tmp/live.html 2>/dev/null || { sleep 2; continue; }
            miss=
            for v in $want; do grep -qF "$v" /tmp/live.html || miss="$v"; done
            if [ -z "$miss" ]; then ok=1; break; fi
            echo "waiting for live assets to update (missing $miss)... ($i)"; sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::Live $BASE/ does not reference the deployed asset versions (stale deploy?)."; exit 1; fi
          curl -fsS "$BASE/u/" >/dev/null || { echo "::error::$BASE/u/ not reachable."; exit 1; }
          echo "  ✓ live site serves the deployed asset versions (and /u/ is up)"
