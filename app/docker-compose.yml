# SwissYGO backend (API only) for the Pi (CasaOS). The existing Caddy serves the
# static SPA and reverse-proxies /api to this container (see app/deploy/Caddyfile).
# NOT needed for offline mode — only run this once you want accounts/registration.
#
#   JWT_SECRET=<long-random> docker compose -f app/docker-compose.yml up -d --build
#
# Publishes on the host so Caddy (on the default bridge) can reach it at
# 172.17.0.1:8787. SQLite persists under /DATA/AppData (CasaOS-friendly, backed up
# like other apps) and survives restarts/rebuilds.
services:
  swissygo-api:
    build:
      context: ./server
      dockerfile: ../Dockerfile
    image: swissygo-api:latest
    container_name: swissygo-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DB_PATH: /data/swissygo.sqlite
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment or app/.env}
    volumes:
      - ${SWISSYGO_DATA_DIR:-/DATA/AppData/swissygo-dev/data}:/data
