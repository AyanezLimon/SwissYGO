# SwissYGO backend (API only) for the Pi (CasaOS). The existing Caddy serves the
# static SPA and reverse-proxies /api to this container (see app/deploy/Caddyfile).
# NOT needed for offline mode — only run this once you want accounts/registration.
#
#   JWT_SECRET=<long-random> docker compose -f app/docker-compose.yml up -d --build
#
# Publishes on the host so Caddy (on the default bridge) can reach it at
# 172.17.0.1:8787. SQLite persists under /DATA/AppData (CasaOS-friendly, backed up
# like other apps) and survives restarts/rebuilds.
services:
  swissygo-api:
    build:
      context: ./server
      dockerfile: ../Dockerfile
    image: swissygo-api:latest
    container_name: swissygo-api
    restart: unless-stopped
    ports:
      - "8787:8787"   # public API (Caddy proxies /api here; in the tunnel)
      - "8788:8788"   # admin — LAN-only; NOT added to the Cloudflare tunnel
    # The Pi kernel doesn't enforce cgroup memory limits (a mem_limit would be
    # discarded), so we cap Node's V8 heap directly — kernel-independent.
    environment:
      PORT: "8787"
      ADMIN_PORT: "8788"
      HOST: "0.0.0.0"
      DB_PATH: /data/swissygo.sqlite
      NODE_OPTIONS: "--max-old-space-size=128"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment or app/.env}
      # Admin tool password (LAN-only). If empty, the admin API is disabled.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Kept OUTSIDE the Caddy web root (/DATA/AppData/swissygo-dev) so the SQLite
      # DB is never served publicly.
      - ${SWISSYGO_DATA_DIR:-/DATA/AppData/swissygo-api/data}:/data
